<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion administrateur</title>
    <link rel="stylesheet" href="../assets/css/tailwind.min.css?v=19">
    <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="pro-page bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen">
    <div class="dash-card max-w-md w-full mx-4 shadow-2xl">
        <p class="dash-overline">Administration</p>
        <h1 class="text-xl font-semibold mb-2">Connexion organisateur</h1>
        <p class="dash-tip mb-4">Connectez-vous avec votre compte organisateur.</p>
        <form id="login-form">
            <label class="block mb-3">
                <span class="dash-field-label">Adresse email</span>
                <input id="login-email" type="email" class="dash-input w-full" placeholder="vous@exemple.com" required autofocus>
            </label>
            <label class="block mb-3">
                <span class="dash-field-label">Mot de passe</span>
                <input id="login-password" type="password" class="dash-input w-full" placeholder="Votre mot de passe" required>
            </label>
            <button type="submit" class="dash-btn dash-btn-save w-full">Se connecter</button>
        </form>
        <p id="login-error" class="text-red-600 text-sm mt-3 hidden"></p>
        <a href="./invitation.html" class="dash-field-note mt-4 inline-block">← Retour invitation</a>
    </div>

    <script src="../assets/js/supabase-config.js?v=54"></script>
    <script src="../assets/js/event-config.js?v=62"></script>
    <script src="../assets/js/auth.js?v=55"></script>
    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            await EventConfig.init();
            const params = new URLSearchParams(window.location.search);
            const eventId = params.get("event") || EventConfig.getEventId();
            const redirect = params.get("redirect") || `./admin.html?event=${eventId}`;

            if (AuthGuard.isEventAdmin(eventId)) {
                window.location.href = redirect;
                return;
            }

            document.getElementById("login-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = document.getElementById("login-email").value.trim();
                const password = document.getElementById("login-password").value;
                const err = document.getElementById("login-error");
                const submit = e.currentTarget.querySelector('button[type="submit"]');
                submit.disabled = true;
                try {
                    await AuthGuard.loginWithPassword(email, password, eventId);
                    window.location.href = redirect;
                } catch (error) {
                    err.textContent = error.message || "Connexion impossible.";
                    err.classList.remove("hidden");
                    submit.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
